<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>접속 테스트 페이지</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Noto Sans SC", sans-serif;
    background: #f4f5f7;
    color: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #14161a; color: #f0f0f0; }
    .card { background: #1f2229; border-color: #2c303a; }
    .ok { color: #6ee7b7; }
  }
  .card {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 40px 48px;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    max-width: 90%;
  }
  .ok {
    color: #16a34a;
    font-size: 48px;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 8px;
  }
  p {
    font-size: 14px;
    opacity: 0.7;
    margin: 4px 0;
  }
  #time {
    font-family: monospace;
    font-size: 13px;
    margin-top: 16px;
    opacity: 0.6;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="ok">✅</div>
    <h1>페이지가 정상적으로 열렸습니다</h1>
    <p>Page loaded successfully / 页面已成功加载</p>
    <p id="time"></p>
  </div>
  <script>
    function updateTime() {
      const now = new Date();
      document.getElementById('time').textContent =
        '접속 시각 / Access time: ' + now.toLocaleString();
    }
    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
